<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>Mother Private Browser</title>
  <link rel="stylesheet" href="browser-ui.css">
</head>
<body>
  <header>
    <div class="brand"><strong>MOTHER <span>PRIVATE BROWSER</span></strong><button id="close" type="button" title="Close private session">Close session</button></div>
    <nav aria-label="Browser controls">
      <button id="back" type="button" aria-label="Back" title="Back">←</button>
      <button id="forward" type="button" aria-label="Forward" title="Forward">→</button>
      <button id="reload" type="button" aria-label="Reload" title="Reload">↻</button>
      <label class="sr-only" for="address">Website address</label><input id="address" type="url" placeholder="https://example.com" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="go" type="button">Open</button>
    </nav>
    <p class="privacy">Cookies and cache clear when this window closes. Local activity stays in Mother until you clear it. Websites can still see your IP address and track you.</p>
    <p id="status" role="status" aria-live="polite">Enter a public HTTPS website.</p>
  </header>
  <script src="browser-ui.js"></script>
</body>
</html>
